services:
  trackete:
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-dev}
    image: trackete:dev
    container_name: trackete
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DB_PATH: ${DB_PATH:-/data/trackete.db}
      JWT_SECRET: ${JWT_SECRET:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      TOKEN_TTL: ${TOKEN_TTL:-720h}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-Trackete <no-reply@trackete.local>}"
      MAIL_FILE_PATH: ${MAIL_FILE_PATH:-/data/outbox.log}
    volumes:
      - trackete-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  trackete-data:
    # Pinned so the README's `-v trackete-data:/data` backup/restore commands and
    # the compose project refer to the same volume.
    name: trackete-data

# Development hot reload. Started by `make dev-api` / `make dev`.
# The production image does not use Air; it builds the binary once.
root = "."
tmp_dir = ".tmp"

[build]
  cmd = "go build -o ./.tmp/trackete ./cmd/server"
  entrypoint = ["./.tmp/trackete"]
  include_ext = ["go", "sql"]
  exclude_dir = [".tmp", ".bin", "data", "node_modules", ".git"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true

[misc]
  clean_on_exit = true
